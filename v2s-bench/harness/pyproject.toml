[project]
name = "v2sbench"
version = "0.1.0"
description = "Extrinsic utility benchmark for video-derived agent skills"
# readme lives at the monorepo root, outside this package directory
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# The hermetic video renderer itself is standard-library only: it draws with a
# bundled bitmap font so that the same recipe yields the same pixels on every
# machine, which FreeType rasterisation would not. Pillow is optional and is
# used only to write single frames out as PNGs for inspection
# (v2sbench.render.save_png), never on the path that produces the mp4.
render = ["pillow>=10.0"]

[project.scripts]
v2sbench = "v2sbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["v2sbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A rescued one-shot generator: it builds the tier-1 recipes by running the
# real tools and capturing real output. Its percent-formatting and long
# literal lines are the screen content it emits, not style choices, and
# rewriting them risks changing what the videos show. Kept as-is on purpose.
"tools/make_tier1_recipes.py" = ["UP031", "E501", "RUF005"]
