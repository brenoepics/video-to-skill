name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Apple Silicon is the primary target; Intel mac and Linux are
    # best-effort and must not block a release.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            optional: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            optional: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            optional: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Sign (ad-hoc)
        if: runner.os == 'macOS'
        run: codesign -s - --force target/release/vts-extract
      - name: Package
        run: |
          NAME=vts-extract-${{ matrix.label }}
          tar -C target/release -czf "$NAME.tar.gz" vts-extract
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" 2>/dev/null || sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: vts-extract-${{ matrix.label }}.tar.gz
      # Immutable releases reject post-publish uploads, so every artifact is
      # staged here and attached in one release-creation call downstream.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: |
            vts-extract-${{ matrix.label }}.tar.gz
            vts-extract-${{ matrix.label }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    # The primary target must have produced artifacts; optional legs may fail.
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" dist/*
