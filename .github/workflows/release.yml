name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Apple Silicon is the primary target; Intel mac and Linux are
    # best-effort and must not block a release.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            optional: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            optional: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            optional: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Sign (ad-hoc)
        if: runner.os == 'macOS'
        run: codesign -s - --force target/release/vts-extract
      - name: Package
        run: |
          BIN=target/release/vts-extract
          NAME=vts-extract-${{ matrix.label }}
          tar -C target/release -czf "$NAME.tar.gz" vts-extract
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" 2>/dev/null || sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: vts-extract-${{ matrix.label }}.tar.gz
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag --generate-notes 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" vts-extract-${{ matrix.label }}.tar.gz vts-extract-${{ matrix.label }}.tar.gz.sha256 --clobber
