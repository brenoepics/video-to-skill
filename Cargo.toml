[workspace]
resolver = "2"
members = ["crates/extractor"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/brenoepics/video-to-skill"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Library code must propagate errors, never panic; tests are exempt via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
# Doc-lint debt accepted while the API is pre-1.0; revisit before publishing.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
