[package]
name = "vts-extract"
description = "Local extraction engine for video-to-skill: ingest, scene/slide detection, keyframe dedup, timestamped ASR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
regex.workspace = true
hound = "3"
dirs = "7"
sha2 = "0.11"
ureq = "3"
# zip's `deflate-flate2` pulls flate2 in with no backend selected, so the ZIP
# reader only builds because ureq's defaults happen to turn on
# flate2/rust_backend. Name the backend here — the same miniz_oxide one already
# in use — so a change to ureq's features cannot break dependency extraction.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }

[[bin]]
name = "vts-extract"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
# Read-only accessibility observation (`vts-extract observe`) and Apple
# Vision text recognition for the screen text track. These objc2 bindings
# are pure Rust over the system frameworks, so the build stays a plain
# `cargo build --locked`; only the framework files the two features touch
# are enabled, which keeps the generated bindings small.
objc2 = "0.6"
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "AXUIElement", "AXError", "libc"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFString", "CFArray", "CFNumber", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNTypes",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[target.'cfg(windows)'.dependencies]
# Windows.Media.Ocr (WinRT) for the screen text track, and read-only UI
# Automation (`vts-extract observe`): COM, the UIA client interfaces and a
# Toolhelp32 process snapshot to resolve `app` by executable name.
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Accessibility",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
